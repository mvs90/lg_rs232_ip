name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: mvs90/display_studio
          ref: 770bf7df1da5d6695cbf470b635b1d5b5d6b4db8 # Display Studio 1.5.1
          path: .test-dependencies/studio
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --workers=4
        env:
          STUDIO_REPO: .test-dependencies/studio
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.3.4'
          - python: '3.14'
            homeassistant: '2026.9.4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "homeassistant==${{ matrix.homeassistant }}" "pytest>=8,<10" "pytest-asyncio>=0.25,<2" "ruff>=0.9,<1" "numpy>=2.2,<3" "PyTurboJPEG>=1.7.5,<2" "coverage>=7,<8" "pillow-heif==1.8.0" "pillow-avif-plugin==1.6.0"
      - uses: actions/checkout@v7
        with:
          repository: mvs90/display_studio
          ref: 770bf7df1da5d6695cbf470b635b1d5b5d6b4db8 # Display Studio 1.5.1
          path: .test-dependencies/studio
      - name: Install Apple TV test dependency matching Home Assistant
        run: python -c "import json, pathlib, subprocess, sys, homeassistant; p=pathlib.Path(homeassistant.__file__).parent/'components/apple_tv/manifest.json'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *json.loads(p.read_text())['requirements']])"
      - run: python -m coverage run -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.test-dependencies/studio
      - name: Report branch coverage
        if: always()
        run: python -m coverage report
      - run: ruff check custom_components tests
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
