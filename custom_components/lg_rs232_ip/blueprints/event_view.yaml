blueprint:
  name: LG Display · Ereignisansicht mit automatischer Rückkehr
  description: >-
    Zeigt eine gespeicherte Studio-Ansicht bei einer Zustandsänderung, zum Beispiel
    eine Kamera neben HDMI beim Klingeln. Wiederholungen ersetzen den Timer.
    Manuelle Bedienung beendet die automatische Rückkehr. Die Ansicht muss vorher
    gespeichert sein; ihre ID steht im Studio. Keine Regel wird ohne dein Zutun aktiviert.
  domain: automation
  source_url: https://github.com/mvs90/lg_rs232_ip/blob/main/custom_components/lg_rs232_ip/blueprints/event_view.yaml
  input:
    trigger_entity:
      name: Auslösende Entität
      selector:
        entity: {}
    trigger_state:
      name: Auslösender Zustand
      default: "on"
      selector:
        text: {}
    display:
      name: LG Display
      selector:
        entity:
          domain: media_player
          integration: lg_rs232_ip
    view:
      name: Gespeicherte Ansicht-ID
      description: Zum Beispiel pip_view oder die view_…-ID einer eigenen Kameraansicht.
      selector:
        text: {}
    duration:
      name: Anzeigedauer
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    wake:
      name: Ausgeschaltetes Display aufwecken
      default: false
      selector:
        boolean: {}
    transition:
      name: Übergang
      default: smooth
      selector:
        select:
          options:
            - label: Animiert
              value: smooth
            - label: Direkt
              value: none
variables:
  display: !input display
  wake: !input wake
triggers:
  - trigger: state
    entity_id: !input trigger_entity
    to: !input trigger_state
conditions:
  - condition: template
    value_template: "{{ wake or states(display) not in ['off', 'unavailable', 'unknown'] }}"
actions:
  - action: lg_rs232_ip.show_view
    target:
      entity_id: !input display
    data:
      view: !input view
      duration: !input duration
      transition: !input transition
mode: restart
