configure_video_wall:
  name: Configure video wall tile
  description: Read, apply and verify this panel's tile geometry through the resident app. Unspecified settings remain unchanged. Failed verification attempts to restore the previous geometry. This does not synchronize video playback across displays.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    enabled:
      name: Enable tile mode
      required: true
      selector:
        boolean: {}
    rows:
      name: Rows
      selector:
        number:
          min: 1
          max: 15
          mode: box
    columns:
      name: Columns
      selector:
        number:
          min: 1
          max: 15
          mode: box
    tile_id:
      name: Tile ID
      description: Must be between 1 and rows multiplied by columns.
      selector:
        number:
          min: 1
          max: 225
          mode: box
    natural_mode:
      name: Compensate for display bezels
      selector:
        boolean: {}
show_view:
  name: Show saved Studio view
  description: Show a saved view using its stable ID. hdmi_full uses the current HDMI input. Smooth transitions animate HDMI geometry when both views contain the same HDMI input. Requires custom layouts and resident SI mode.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    theme:
      name: Studio theme ID
      description: Optional saved theme ID (cinema, aurora, morning, sand, or theme_...). After the view is shown successfully, selects this as the persistent global theme. Manual view overrides remain; duration returns only the view, not the global theme.
      selector:
        text: {}
    view:
      name: View ID
      description: hdmi_full, dashboard, pip_view, media_view, or a saved custom view ID.
      required: true
      selector:
        text: {}
    duration:
      name: Display duration
      description: Seconds before returning to the previous view. Zero keeps this view. New temporary requests replace the timer; manual controls cancel the return. Timers are not resumed after a restart.
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box
    transition:
      name: Transition
      default: none
      selector:
        select:
          options:
          - label: Direct
            value: none
          - label: Animated
            value: smooth
clear_content:
  name: Clear temporary content
  description: Clear the queue, cancel the current presentation and restore its display
    input where possible.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields: {}
send_remote_command:
  name: Send remote command
  description: Send a navigation key to the LG display itself.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    command:
      name: Command
      selector:
        select:
          options:
          - up
          - down
          - left
          - right
          - select
          - menu
          - home
          - information
          - back
          - exit
      required: true
show_toast:
  name: Show native LG text overlay
  description: Display text over the current picture. Requires native web access and
    an awake panel. LG controls the duration.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    message:
      name: Message (1–1000 characters)
      required: true
      selector:
        text: {}
    priority: &id001
      name: Priority
      selector:
        select:
          options:
          - normal
          - urgent
      default: normal
show_native_image:
  name: Show native LG fullscreen image
  description: Upload a temporary PNG/JPEG (up to 5 MiB), show it, restore the external
    input and delete the upload. Requires native web access.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_id:
      name: Image URL or media-source ID
      required: true
      selector:
        text: {}
    duration:
      name: Duration (seconds)
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          mode: box
    priority: *id001
prepare_boot_image:
  name: Prepare custom boot image for USB import
  description: Create a 1920x1080 JPEG in Home Assistant Media. Download and copy
    it to LG_MONITOR on USB, then import it on the display. Does not install remotely
    or reboot.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_id:
      name: Source image URL or media-source ID
      required: true
      selector:
        text: {}
    media_directory:
      name: Home Assistant media directory key
      default: local
      selector:
        text: {}
show_native_video:
  name: Show native LG video
  description: Upload an MP4 file (up to 50 MiB), play for the requested duration,
    restore the external input and delete the temporary file. Requires native web
    access.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_id:
      name: MP4 URL or media-source ID
      required: true
      selector:
        text: {}
    duration:
      name: Display duration (seconds)
      description: Return after this time, not automatically at the end of the file.
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          mode: box
    priority: *id001
show_website:
  name: Show website on LG
  description: Temporarily set Play via URL and select its input without rebooting.
    Restore the previous input and URL settings afterward. Requires native web access.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    url:
      name: Website URL (HTTP or HTTPS)
      required: true
      selector:
        text: {}
    duration:
      name: Display duration (seconds)
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          mode: box
    priority: *id001
show_stream:
  name: Show stream on LG
  description: Open an HTTP(S) HLS or browser-compatible video URL through a temporary
    HTML video page hosted by Home Assistant. The LG must reach HA and the source.
    Requires native web access.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_id:
      name: Stream URL or media-source ID
      required: true
      selector:
        text: {}
    duration:
      name: Display duration (seconds)
      default: 300
      selector:
        number:
          min: 1
          max: 3600
          mode: box
    muted:
      name: Mute stream audio
      description: Muted playback is most compatible with browser autoplay. Native
        LG audio is not automatically sent to Sonos through the AX310.
      default: true
      selector:
        boolean: {}
    priority: *id001

show_display_app:
  name: Show display app
  description: Show a paired Home Assistant notification or selected sensor overview, then return to HDMI. Requires enabled display app and native web access.
  target:
    entity:
      integration: lg_rs232_ip
      domain: media_player
  fields:
    title:
      name: Title
      default: Home Assistant
      selector:
        text:
    message:
      name: Message
      selector:
        text:
          multiline: true
    duration:
      name: Duration
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    dashboard:
      name: Include selected sensors
      default: false
      selector:
        boolean:
    priority:
      name: Priority
      default: normal
      selector:
        select:
          options:
            - normal
            - urgent
    layout:
      name: Layout
      description: HDMI overlay and picture-in-picture require SI mode and compatible firmware. The initial app launch can briefly interrupt the picture.
      default: fullscreen
      selector:
        select:
          options:
            - fullscreen
            - overlay
            - pip

prepare_ism_media:
  name: Prepare ISM media for USB import
  description: Prepare 1–4 images (JPEG, PNG or BMP, each up to 5 MiB) or one MP4 video (up to 50 MiB) in a separate ISM folder in Home Assistant Media. Images are fitted to 1920×1080. Download the files into ISM on USB and import through the LG ISM menu. This does not upload or install ISM media on the display.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_ids:
      name: Media-source IDs or URLs
      required: true
      selector:
        text:
          multiple: true
    media_type:
      name: Media type
      default: image
      selector:
        select:
          options:
            - image
            - video
    media_directory:
      name: Home Assistant media directory
      default: local
      selector:
        text:
add_power_schedule:
  name: Add native power schedule
  description: Store an on/off time in the LG itself (display local time). Requires native web access and an awake UH5F. Does not switch a smart
    plug or linked player. Matching duplicates are a no-op; at most seven entries per list.
  fields:
    kind:
      name: Action
      required: true
      selector:
        select:
          options:
          - power_on
          - power_off
    time:
      name: Display local time (HH:MM)
      required: true
      example: 07:00
      selector:
        text: {}
    repeat:
      name: Repeat days
      required: true
      selector:
        select:
          options:
          - daily
          - weekdays
          - monday_saturday
          - weekends
          - sun
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
add_brightness_schedule:
  name: Add native brightness schedule
  description: Store a daily backlight level in the LG (maximum six entries). Enable brightness scheduling first. Local display time; other entries
    are preserved. To change an existing time, remove its entry first.
  fields:
    time:
      name: Display local time (HH:MM)
      required: true
      example: 07:00
      selector:
        text: {}
    backlight:
      name: Backlight
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
remove_native_schedule:
  name: Remove native schedule entry
  description: Remove exactly one entry using its ID from the schedule sensor's entries attribute. The active list and serial slot are checked
    again before deletion. Brightness scheduling must be enabled to edit it.
  fields:
    kind:
      name: Schedule type
      required: true
      selector:
        select:
          options:
          - power_on
          - power_off
          - brightness
    schedule_id:
      name: Entry ID from the schedule sensor
      required: true
      selector:
        text: {}
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
set_timezone:
  name: Set LG timezone
  description: Select a timezone from the display's own catalog. Requires native web access, an awake UH5F and automatic time enabled. Existing
    native schedules follow the new local time. Continent, country and timezone are verified in sequence.
  fields:
    continent:
      name: LG continent
      required: true
      selector:
        select:
          options:
          - Africa
          - Asia
          - CIS
          - Europe
          - MiddleEast
          - NorthAmerica
          - Oceania
          - Pacific
          - SouthAmerica
    country:
      name: Country code
      required: true
      example: DE
      selector:
        text: {}
    timezone:
      name: Timezone from get_timezones
      required: true
      example: Europe/Berlin
      selector:
        text: {}
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
get_timezones:
  name: Read LG timezone catalog
  description: Return the timezone identifiers supported by this display for a country. Requires native web access and an awake UH5F.
  fields:
    country:
      name: Country code
      required: true
      example: DE
      selector:
        text: {}
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
configure_dst:
  name: Configure manual daylight saving
  description: Manual DST requires automatic time to be disabled before enabling it. Supply all eight rule fields together, or omit all to change
    only enabled. Week 5 means last; weekday 0 means Sunday. Rule changes temporarily disable manual DST until both rules are verified.
  fields:
    enabled:
      name: Enable manual DST
      required: true
      selector:
        boolean: {}
    start_month:
      name: Start month
      selector:
        number:
          min: 1
          max: 12
          mode: box
          step: 1
    start_week:
      name: Start week
      selector:
        number:
          min: 1
          max: 5
          mode: box
          step: 1
    start_weekday:
      name: Start weekday
      selector:
        number:
          min: 0
          max: 6
          mode: box
          step: 1
    start_hour:
      name: Start hour
      selector:
        number:
          min: 0
          max: 23
          mode: box
          step: 1
    end_month:
      name: End month
      selector:
        number:
          min: 1
          max: 12
          mode: box
          step: 1
    end_week:
      name: End week
      selector:
        number:
          min: 1
          max: 5
          mode: box
          step: 1
    end_weekday:
      name: End weekday
      selector:
        number:
          min: 0
          max: 6
          mode: box
          step: 1
    end_hour:
      name: End hour
      selector:
        number:
          min: 0
          max: 23
          mode: box
          step: 1
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
