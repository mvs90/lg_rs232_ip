configure_video_wall:
  name: Configure video wall tile
  description: Read, apply and verify this panel's tile geometry through the resident app. Unspecified settings remain unchanged. Failed verification attempts to restore the previous geometry. This does not synchronize video playback across displays.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    enabled:
      name: Enable tile mode
      required: true
      selector:
        boolean: {}
    rows:
      name: Rows
      selector:
        number:
          min: 1
          max: 15
          mode: box
    columns:
      name: Columns
      selector:
        number:
          min: 1
          max: 15
          mode: box
    tile_id:
      name: Tile ID
      description: Must be between 1 and rows multiplied by columns.
      selector:
        number:
          min: 1
          max: 225
          mode: box
    natural_mode:
      name: Compensate for display bezels
      selector:
        boolean: {}
show_view:
  name: Show saved Studio view
  description: Show a saved view using its stable ID. hdmi_full uses the current HDMI input. Smooth transitions animate HDMI geometry when both views contain the same HDMI input. Requires custom layouts and resident SI mode.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    view:
      name: View ID
      description: hdmi_full, dashboard, pip_view, media_view, or a saved custom view ID.
      required: true
      selector:
        text: {}
    duration:
      name: Display duration
      description: Seconds before returning to the previous view. Zero keeps this view. New temporary requests replace the timer; manual controls cancel the return. Timers are not resumed after a restart.
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box
    transition:
      name: Transition
      default: none
      selector:
        select:
          options:
          - label: Direct
            value: none
          - label: Animated
            value: smooth
clear_content:
  name: Clear temporary content
  description: Clear the queue, cancel the current presentation and restore its display
    input where possible.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields: {}
send_remote_command:
  name: Send remote command
  description: Send a navigation key to the LG display itself.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    command:
      name: Command
      selector:
        select:
          options:
          - up
          - down
          - left
          - right
          - select
          - menu
          - home
          - information
          - back
          - exit
      required: true
show_toast:
  name: Show native LG text overlay
  description: Display text over the current picture. Requires native web access and
    an awake panel. LG controls the duration.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    message:
      name: Message (1–1000 characters)
      required: true
      selector:
        text: {}
    priority: &id001
      name: Priority
      selector:
        select:
          options:
          - normal
          - urgent
      default: normal
show_native_image:
  name: Show native LG fullscreen image
  description: Upload a temporary PNG/JPEG (up to 5 MiB), show it, restore the external
    input and delete the upload. Requires native web access.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_id:
      name: Image URL or media-source ID
      required: true
      selector:
        text: {}
    duration:
      name: Duration (seconds)
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          mode: box
    priority: *id001
prepare_boot_image:
  name: Prepare custom boot image for USB import
  description: Create a 1920x1080 JPEG in Home Assistant Media. Download and copy
    it to LG_MONITOR on USB, then import it on the display. Does not install remotely
    or reboot.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_id:
      name: Source image URL or media-source ID
      required: true
      selector:
        text: {}
    media_directory:
      name: Home Assistant media directory key
      default: local
      selector:
        text: {}
show_native_video:
  name: Show native LG video
  description: Upload an MP4 file (up to 50 MiB), play for the requested duration,
    restore the external input and delete the temporary file. Requires native web
    access.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_id:
      name: MP4 URL or media-source ID
      required: true
      selector:
        text: {}
    duration:
      name: Display duration (seconds)
      description: Return after this time, not automatically at the end of the file.
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          mode: box
    priority: *id001
show_website:
  name: Show website on LG
  description: Temporarily set Play via URL and select its input without rebooting.
    Restore the previous input and URL settings afterward. Requires native web access.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    url:
      name: Website URL (HTTP or HTTPS)
      required: true
      selector:
        text: {}
    duration:
      name: Display duration (seconds)
      default: 60
      selector:
        number:
          min: 1
          max: 3600
          mode: box
    priority: *id001
show_stream:
  name: Show stream on LG
  description: Open an HTTP(S) HLS or browser-compatible video URL through a temporary
    HTML video page hosted by Home Assistant. The LG must reach HA and the source.
    Requires native web access.
  target:
    entity:
      domain: media_player
      integration: lg_rs232_ip
  fields:
    media_id:
      name: Stream URL or media-source ID
      required: true
      selector:
        text: {}
    duration:
      name: Display duration (seconds)
      default: 300
      selector:
        number:
          min: 1
          max: 3600
          mode: box
    muted:
      name: Mute stream audio
      description: Muted playback is most compatible with browser autoplay. Native
        LG audio is not automatically sent to Sonos through the AX310.
      default: true
      selector:
        boolean: {}
    priority: *id001

show_display_app:
  name: Show display app
  description: Show a paired Home Assistant notification or selected sensor overview, then return to HDMI. Requires enabled display app and native web access.
  target:
    entity:
      integration: lg_rs232_ip
      domain: media_player
  fields:
    title:
      name: Title
      default: Home Assistant
      selector:
        text:
    message:
      name: Message
      selector:
        text:
          multiline: true
    duration:
      name: Duration
      default: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    dashboard:
      name: Include selected sensors
      default: false
      selector:
        boolean:
    priority:
      name: Priority
      default: normal
      selector:
        select:
          options:
            - normal
            - urgent
    layout:
      name: Layout
      description: HDMI overlay and picture-in-picture require SI mode and compatible firmware. The initial app launch can briefly interrupt the picture.
      default: fullscreen
      selector:
        select:
          options:
            - fullscreen
            - overlay
            - pip
